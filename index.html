<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrthoMaster Pro — Plataforma 3D Fotorrealista</title>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --panel-bg: rgba(20, 27, 45, 0.85);
      --accent-neon: #00f2fe;
      --accent-purple: #7928ca;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --border-glow: rgba(0, 242, 254, 0.25);
      --positive: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
      background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0a0f1d 70%);
    }

    #app-container {
      width: 100%;
      max-width: 1100px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(45deg, var(--accent-neon), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .main-content { padding: 25px 30px; }

    .lab-grid {
      display: grid;
      grid-template-columns: 1.8fr 1fr;
      gap: 20px;
    }

    .canvas-card {
      background: #000000;
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      height: 420px;
      position: relative;
      overflow: hidden;
    }

    #three-canvas {
      width: 100%;
      height: 100%;
    }

    .canvas-hint {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-size: 11px;
      color: var(--text-sub);
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
    }

    .controls-panel {
      background: rgba(255, 255, 255, 0.03);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--accent-neon);
      border-radius: 8px;
      background: rgba(0, 242, 254, 0.1);
      color: var(--accent-neon);
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-action:hover {
      background: var(--accent-neon);
      color: #000;
    }

    .status-badge {
      background: rgba(34, 197, 94, 0.2);
      color: var(--positive);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      display: inline-block;
    }
  </style>

  <!-- Importamos Three.js y OrbitControls vía CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="app-container">
    <div class="header">
      <div class="brand">OrthoMaster Pro 3D</div>
      <span class="status-badge">● Visor WebGL 3D Activo</span>
    </div>

    <div class="main-content">
      <div class="lab-grid">
        <div class="canvas-card">
          <div id="three-canvas"></div>
          <div class="canvas-hint">🖱️ Mantén presionado y arrastra para rotar en 3D | Rueda para zoom</div>
        </div>

        <div class="controls-panel">
          <h3 style="font-size:16px;">Controles Biomecánicos</h3>
          
          <button class="btn-action" onclick="toggleBrackets()">1. Alternar Brackets y Arcos</button>
          <button class="btn-action" onclick="applyRetraction()">2. Simular Retracción Anterior</button>
          <button class="btn-action" onclick="resetSim()" style="border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1);">Reiniciar Posición</button>

          <div style="margin-top: 15px; font-size: 13px; color: var(--text-sub); border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px;">
            <strong>Tensión Biomecánica:</strong> <br>
            <span id="force-val" style="color:var(--accent-neon); font-size: 16px;">0.0 N</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configuración Escena Three.js
    const container = document.getElementById('three-canvas');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 8, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Luces de Estudio Médico
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0x00f2fe, 0.8);
    dirLight1.position.set(10, 20, 10);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight2.position.set(-10, -10, -10);
    scene.add(dirLight2);

    // Materiales Fotorrealistas
    const gumMaterial = new THREE.MeshPhongMaterial({ color: 0xd97780, roughness: 0.3 });
    const toothMaterial = new THREE.MeshPhysicalMaterial({ 
      color: 0xffffff, roughness: 0.1, transmission: 0.1, thickness: 0.5, clearcoat: 1.0 
    });
    const bracketMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.2 });

    // Construcción de la Arcada Dental
    const archGroup = new THREE.Group();
    const teethList = [];
    const bracketsList = [];

    // Encía
    const gumGeo = new THREE.TorusGeometry(6, 1.2, 16, 32, Math.PI);
    const gum = new THREE.Mesh(gumGeo, gumMaterial);
    gum.rotation.x = Math.PI / 2;
    archGroup.add(gum);

    // Dientes y Brackets
    const toothCount = 10;
    for (let i = 0; i <= toothCount; i++) {
      const angle = (i / toothCount) * Math.PI;
      const x = 6 * Math.cos(angle);
      const z = 6 * Math.sin(angle);

      // Diente (Esfera escalada)
      const toothGeo = new THREE.SphereGeometry(0.8, 32, 32);
      const tooth = new THREE.Mesh(toothGeo, toothMaterial);
      tooth.position.set(x, 0, z);
      tooth.scale.set(0.8, 1.2, 0.8);
      archGroup.add(tooth);
      teethList.push(tooth);

      // Bracket
      const bracketGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
      const bracket = new THREE.Mesh(bracketGeo, bracketMaterial);
      bracket.position.set(x * 1.12, 0, z * 1.12);
      bracket.visible = false;
      archGroup.add(bracket);
      bracketsList.push(bracket);
    }

    scene.add(archGroup);

    // Animación Render Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Controles de Simulación
    let bracketsVisible = false;
    function toggleBrackets() {
      bracketsVisible = !bracketsVisible;
      bracketsList.forEach(b => b.visible = bracketsVisible);
    }

    function applyRetraction() {
      // Mueve los dientes centrales en 3D
      teethList[4].position.z -= 0.4;
      teethList[5].position.z -= 0.4;
      bracketsList[4].position.z -= 0.4;
      bracketsList[5].position.z -= 0.4;
      document.getElementById('force-val').innerText = '1.8 N (Retracción en curso)';
    }

    function resetSim() {
      teethList[4].position.z = 6 * Math.sin((4 / toothCount) * Math.PI);
      teethList[5].position.z = 6 * Math.sin((5 / toothCount) * Math.PI);
      bracketsList[4].position.z = 6.72 * Math.sin((4 / toothCount) * Math.PI);
      bracketsList[5].position.z = 6.72 * Math.sin((5 / toothCount) * Math.PI);
      document.getElementById('force-val').innerText = '0.0 N';
    }

    // Adaptación a la ventana
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
